    UpdateAudit:
      title: UPDATE_AUDIT
      required:
      - change_type
      - committer
      type: object
      properties:
        _type:
          type: string
          default: UPDATE_AUDIT
        system_id:
          type: string
          description: 'Optional identifier of the system where the change was committed. When provided it will be

            validated; when omitted the server sets its own value.

            '
        change_type:
          $ref: '#/components/schemas/DvCodedText'
        description:
          $ref: '#/components/schemas/UDvText'
        committer:
          $ref: '#/components/schemas/UPartyProxy'
      description: 'The set of attributes required to document the committal of an information item to a repository.


        `UPDATE_AUDIT` is a REST commit DTO, not an RM class: structurally an `AUDIT_DETAILS` without the

        server-assigned attributes (`time_committed` is always set by the server; `system_id` is optional on

        commit). The server uses it to create the persisted `AUDIT_DETAILS` object.


        Clients SHOULD send `_type: "UPDATE_AUDIT"`. For interoperability with existing implementations,

        servers SHOULD additionally accept `_type: "AUDIT_DETAILS"` or an omitted `_type` for this attribute.

        '
      example:
        _type: UPDATE_AUDIT
        change_type:
          value: creation
          defining_code:
            terminology_id:
              value: openehr
            code_string: '249'
        description: Description text
        committer:
          _type: PARTY_IDENTIFIED
          name: A user name
