        example: 6cb19121-4307-4648-9da0-d62e4d51f19b::openEHRSys.example.com::2
    ContentType_canonical:
      name: Content-Type
      in: header
      style: simple
      schema:
        type: string
        enum:
        - application/json
        - application/xml
    Accept_canonical:
      name: Accept
      in: header
      style: simple
      schema:
        type: string
        enum:
        - application/json
        - application/xml
    version_at_time:
      name: version_at_time
      in: query
      description: 'A given time in the extended ISO 8601 format.

        '
      style: form
      explode: true
      schema:
        type: string
        format: datetime
        example: '2015-01-20T19:30:22.765+01:00'
    versioned_object_uid_PARTY:
      name: versioned_object_uid
      in: path
      description: 'VERSIONED_PARTY identifier taken from VERSIONED_PARTY.uid.value.

        '
      required: true
      style: simple
      schema:
        type: string
        format: uuid
        example: 6cb19121-4307-4648-9da0-d62e4d51f19b
  headers:
    ContentType_canonical:
      schema:
        type: string
        enum:
        - application/xml
        - application/json
    Location_deprecated:
      description: 'The `Location` is [deprecated](overview.html#tag/Requests_and_responses/HTTP-headers/Location) for this action.

        '
      deprecated: true
      schema:
        type: string
    ETag_VERSION:
      description: 'The `ETag` (i.e. entity tag) response header is the VERSION identifier (i.e. the `version_uid`) enclosed by double quotes.

        '
      schema:
        type: string
        example: W/"6cb19121-4307-4648-9da0-d62e4d51f19b::openEHRSys.example.com::2"
  responses:
    404_not_found_or_no_version_at_time:
      description: '`404 Not Found` is returned when either the URL configured doesn''t exist at all, or the targeted resource doesn''t exist, or when a VERSION of the resource does not exist at the specified `version_at_time`.

        '
    200_REVISION_HISTORY:
      description: '`200 OK` is returned when the requested REVISION_HISTORY is successfully retrieved.

        '
      headers:
        Content-Type:
          $ref: '#/components/headers/ContentType_canonical'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionHistory'
    200_VERSION_of_PARTY_by_id:
      description: '`200 OK` is returned when the requested VERSION is successfully retrieved.

        '
      headers:
        Content-Type:
          $ref: '#/components/headers/ContentType_canonical'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UVersionOfParty'
    '404':
      description: '`404 Not Found` is returned when, based on the request parameters, the server did not find a current representation of a target resource, or is not willing to disclose that one exists.

        '
    200_VERSIONED_PARTY:
      description: '`200 OK` is returned when the requested VERSIONED_PARTY is successfully retrieved.

        '
      headers:
        Content-Type:
          $ref: '#/components/headers/ContentType_canonical'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionedParty'
    200_VERSION_of_PARTY_at_time:
      description: '`200 OK` is returned when the requested VERSION is successfully retrieved.

        '
      headers:
        ETag:
          $ref: '#/components/headers/ETag_VERSION'
        Location:
          $ref: '#/components/headers/Location_deprecated'
        Content-Type:
          $ref: '#/components/headers/ContentType_canonical'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UVersionOfParty'
