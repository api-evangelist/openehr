note: >-
  openEHR is governed by TWO UK legal entities and the split is the thing to understand. The openEHR
  Foundation, a not-for-profit company limited by guarantee regulated under the UK Companies Acts 1985
  and 1989, holds the intellectual property and appoints two directors to the operating company. The
  openEHR Community Interest Company, which trades as openEHR International and is regulated by the
  Companies (Audit, Investigations and Community Enterprise) Act 2004, has run day-to-day operations
  since 10 May 2019. The Foundation is expected to merge into openEHR International. Unlike OGC, the
  working surface here is public: every program board roster is on the open web with names, roles and
  employers, and the specification work happens in a public GitHub org and a public Discourse forum.
  That is why this repo can name 59 people where the OGC profile could name only staff.
entities:
- name: openEHR Foundation
  form: UK not-for-profit company limited by guarantee
  regulation: UK Companies Acts 1985 and 1989
  role: Holds the openEHR intellectual property; appoints two directors to the CIC.
  status: Expected to merge into openEHR International.
  chair: Sam Heard
- name: openEHR International
  form: openEHR Community Interest Company (CIC), UK member-owned not-for-profit
  regulation: Companies (Audit, Investigations and Community Enterprise) Act 2004
  role: Runs day-to-day operations of openEHR since 10 May 2019.
  operational_since: '2019-05-10'
  ceo: Jordi Piera-Jiménez
