- name: Specification Program (SEC)
  role: >-
    The Specifications Editorial Committee — writes and edits every openEHR specification, owns the
    release process, and is the body named as `info.contact` inside the published OpenAPI documents.
  roster_public: true
  seats: 29
  co_chairs:
  - Rong Chen
  - Sebastian Iancu
  - Bostjan Lah
  source: https://openehr.org/specification-program/
- name: Clinical Program Board (CPB)
  role: >-
    Governs the clinical content — the archetypes and templates in the Clinical Knowledge Manager —
    through a Clinical Models Editorial Group. This is the body that has no analogue in a
    developer-led standard, and it is where openEHR's two-level modelling actually gets its second level.
  roster_public: true
  seats: 17
  co_chairs:
  - Paul Miller
  - Vanessa Pereira
  source: https://openehr.org/clinical-program-board/
- name: Education Program Board (EPB)
  role: Defines roles and skills for openEHR practitioners and runs the educator recognition program.
  roster_public: true
  seats: 6
  co_chairs:
  - Heather Grain
  - Hanna Pohjonen
  source: https://openehr.org/education-program/
