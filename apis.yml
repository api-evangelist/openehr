description: 'openEHR is the open specification family for electronic health records, and the main structural alternative
  to HL7 FHIR. It is governed by two UK not-for-profit entities: the openEHR Foundation, a company limited by guarantee
  that holds the intellectual property, and the openEHR Community Interest Company, trading as openEHR International,
  which has run day-to-day operations since 10 May 2019. Its defining idea is two-level modelling — a small, stable
  Reference Model that software implements once, plus a large, separately governed body of clinician-authored archetypes
  and templates expressed in the Archetype Definition Language and queried through the Archetype Query Language. The
  specification site publishes 68 specifications across 14 components at three maturity levels of openEHR''s own declaring:
  Stable (AM, BASE, CDS, ITS-REST, ITS-XML, LANG, QUERY, RM, TERM), Development (CNF, ITS-BMM, ITS-JSON, SM) and Paused
  (PROC). The ITS-REST component ships real OpenAPI 3.0 for six API surfaces — EHR, Query, Definition and System are
  STABLE, Demographic and Admin are DEVELOPMENT — under a Creative Commons Attribution-NoDerivs 3.0 licence, with
  the tooling repositories under Apache-2.0. The coalition is unusually legible: 59 named people across the CIC Board,
  Foundation Board and the Specification, Clinical and Education program boards, with employers published beside 37
  of them. What this repo holds are SPECIFICATIONS, not services — every contract here has the templated server https://{baseUrl}/v1
  and describes what a conformant implementation must offer, so none of it is a callable API and it must never be
  read as one.'
