- aid: openehr:openehr-adl1-4-api
  name: openEHR ADL1.4 API
  description: "Management of [AOM and ADL 1.4](https://specifications.openehr.org/releases/AM/latest)\
    \ Operational Templates (OPTs). \nThese templates can be created using [modelling tools](https://www.openehr.org/downloads/modellingtools)\
    \ such as the Template Designer and the Archetype Designer. \n\nOperational templates simplify the\
    \ creation of openEHR-based input or storage implementations by, for a specific COMPOSITION template\
    \ (use case), collecting all labels, requirements and constraints from all contained archetypes and\
    \ sub-templates into a single easily parsed file. \nThis file can be a basis for UI-generation/creation\
    \ and for data validation."
  humanURL: https://specifications.openehr.org/releases/ITS-REST/latest/ehr.html
