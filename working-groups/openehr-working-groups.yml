note: openEHR calls these PROGRAMS, not working groups. There is no per-specification working group the way CAMARA
  charters one repo per API or OGC charters an SWG per standard — the Specification Program owns all fourteen specification
  components at once. That is a smaller, more centralised drafting structure than either, and it is worth reading
  against the 68 specifications it maintains.
